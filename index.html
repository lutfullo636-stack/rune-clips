<style>
/* Layout: one phone-width app column, four tabs on a bottom bar. Single dark world. */
:root{
  --ink:#0c0e13;--panel:#151922;--panel2:#1b2030;--line:#252b3b;
  --red:#ff3b47;--mint:#33dca0;--amber:#ffb547;
  --tx:#f3f5f9;--mut:#8f98ad;
  --display:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--tx);font:500 15px/1.45 var(--body)}
body{min-height:100%}
#app{max-width:520px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 120px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{width:30px;height:30px;border-radius:9px;margin-right:10px;vertical-align:middle;flex:none}
.brandrow{display:flex;align-items:center}
.brand{font:700 13px var(--display);letter-spacing:.04em;color:var(--mut);text-transform:uppercase}
.date{color:var(--mut);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 18px}
.ring{position:relative;width:176px;height:176px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .n{font:800 52px/1 var(--display);font-variant-numeric:tabular-nums}
.ring .l{color:var(--mut);font-size:12px;margin-top:4px}
.msg{margin:14px 0 4px;font:700 18px var(--display)}
.msg2{color:var(--mut);font-size:13px;margin:0 0 16px}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:700 16px var(--display);color:#fff;background:var(--red);cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.ok{background:rgba(51,220,160,.14);color:var(--mint);border:1px solid rgba(51,220,160,.5)}
.btn.ghost{background:var(--panel2);color:var(--tx);font-weight:600;font-size:14px;padding:12px}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;color:var(--mut);font:600 13px var(--body);padding:10px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.links{display:flex;gap:6px;justify-content:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dot{aspect-ratio:1;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 13px var(--display);color:var(--mut);cursor:pointer}
.dot.done{background:rgba(51,220,160,.16);border-color:var(--mint);color:var(--mint)}
.dot.x{background:rgba(255,59,71,.14);border-color:var(--red);color:var(--red)}
.dot.rest{background:rgba(143,152,173,.14);border-color:var(--mut);color:var(--tx)}
.dot.today{box-shadow:0 0 0 2px var(--ink),0 0 0 3.5px var(--tx)}
.dl{text-align:center;color:var(--mut);font-size:11px;margin-top:5px}
.sec{font:700 12px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
.stepper{display:flex;gap:5px;margin:10px 0}
.stepper i{flex:1;height:6px;border-radius:4px;background:var(--panel2)}
.stepper i.on{background:var(--red)}
.stepper.big i{height:8px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.t{font:600 15px/1.3 var(--display);overflow-wrap:anywhere}
.t.btnlike{cursor:pointer}
.m{color:var(--mut);font-size:12.5px}
.chip{display:inline-block;padding:5px 11px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;margin:0 6px 6px 0}
.chip.red{background:rgba(255,59,71,.12);border-color:rgba(255,59,71,.4);color:#ff9097}
.chip.ok{background:rgba(51,220,160,.12);border-color:rgba(51,220,160,.45);color:var(--mint)}
.chip.warn{background:rgba(255,181,71,.12);border-color:rgba(255,181,71,.45);color:var(--amber)}
textarea,input[type=text],input[type=number],select{width:100%;font:500 15px var(--body);color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--red)}
textarea{resize:vertical;min-height:84px}
textarea.tall{min-height:190px}
label.f{display:block;color:var(--mut);font-size:12px;margin:14px 0 6px}
.steps{display:flex;flex-direction:column;gap:9px}
.st{display:flex;gap:10px;align-items:center;font-size:14px}
.st .b{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.st.run .b{border-color:var(--red);border-top-color:transparent;animation:sp .8s linear infinite}
.st.ok .b{background:var(--mint);border-color:var(--mint)}
.st.fail .b{background:var(--amber);border-color:var(--amber)}
.st.fail,.st.skip{color:var(--mut)}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.st.run .b{animation:none}.btn{transition:none}}
.title-row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.title-row:first-of-type{border-top:0}
.score{flex:none;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:800 17px var(--display);background:var(--panel2);color:var(--mut);font-variant-numeric:tabular-nums}
.score.hi{background:rgba(51,220,160,.15);color:var(--mint)}
.score.mid{background:rgba(255,181,71,.15);color:var(--amber)}
.best{display:inline-block;font:700 10px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--mint);margin-bottom:3px}
.acts{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
ul.ins{margin:0;padding-left:18px}
ul.ins li{margin-bottom:8px}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.tile b{display:block;font:800 30px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{color:var(--mut);font-size:12.5px}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--mut)}
.bars i{display:block;width:100%;background:var(--red);border-radius:6px 6px 3px 3px;min-height:3px}
.prog{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--red);border-radius:99px}
.prog.full i{background:var(--mint)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.chk:first-of-type{border-top:0}
.chk input{width:20px;height:20px;accent-color:var(--mint);margin:1px 0 0;flex:none}
.crow{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow .l2{display:flex;gap:10px;align-items:center}
.crow .l2 input[type=checkbox]{width:20px;height:20px;accent-color:var(--mint);flex:none}
.back{background:none;border:0;color:var(--mut);font:600 14px var(--body);padding:0;margin-bottom:14px;cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:linear-gradient(to top,var(--ink) 70%,transparent);padding:10px 12px max(12px,env(safe-area-inset-bottom))}
.tabs{display:flex;width:100%;max-width:496px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:6px}
.tab{flex:1;border:0;background:none;color:var(--mut);font:600 10.5px var(--body);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:16px;cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:var(--panel2);color:var(--tx)}
.tab.on svg{stroke:var(--red)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--tx);color:var(--ink);font:700 13px var(--body);padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%;text-align:center}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.tog{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--mut);font-size:13px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--red)}
input[type=datetime-local]{width:100%;font:500 15px var(--body);color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;color-scheme:dark}
a.btn.sm{display:inline-block;text-align:center;text-decoration:none}
.bub{padding:12px 14px;border-radius:18px;margin-bottom:10px;max-width:92%;font-size:14.5px;overflow-wrap:anywhere}
.bub.u{background:var(--red);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.bub.a{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
button:focus-visible,.dot:focus-visible,.tab:focus-visible{outline:2px solid var(--tx);outline-offset:2px}

/* AI tab: ChatGPT-style chat */
.cg-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cg-title{font:700 17px var(--display);display:flex;align-items:center;gap:8px}
.cg-new{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:8px 12px;font:600 13px var(--body);cursor:pointer;display:flex;gap:6px;align-items:center}
.cg-new svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cg-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 4px 10px}
.cg-logo{width:52px;height:52px;border-radius:50%;background:var(--tx);color:var(--ink);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.cg-logo svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cg-empty h2{font-size:26px;margin-bottom:22px}
.cg-sug{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.cg-sug button{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:16px;padding:12px;font:500 13.5px/1.35 var(--body);text-align:left;cursor:pointer}
.cg-sug button:active{background:var(--panel2)}
.cg-row{display:flex;gap:10px;margin:18px 0}
.cg-row.u{justify-content:flex-end}
.cg-u{background:#2a3042;border-radius:20px;padding:10px 16px;max-width:82%;overflow-wrap:anywhere;font-size:15px}
.cg-av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tx);color:var(--ink);display:flex;align-items:center;justify-content:center;margin-top:2px}
.cg-av svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cg-a{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px;line-height:1.55}
.cg-act{display:flex;gap:4px;margin-top:6px}
.cg-act button{background:none;border:0;color:var(--mut);padding:6px;border-radius:8px;cursor:pointer;display:flex}
.cg-act button:hover{background:var(--panel)}
.cg-act svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cg-dots{display:inline-flex;gap:4px;padding:8px 0}
.cg-dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:cgb 1.2s infinite ease-in-out}
.cg-dots i:nth-child(2){animation-delay:.15s}.cg-dots i:nth-child(3){animation-delay:.3s}
@keyframes cgb{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.cg-bar{position:fixed;left:0;right:0;bottom:var(--tbh,92px);display:flex;justify-content:center;padding:6px 12px 8px;background:linear-gradient(to top,var(--ink) 75%,transparent);z-index:5}
.cg-in{width:100%;max-width:496px;display:flex;align-items:flex-end;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:26px;padding:6px 6px 6px 16px}
.cg-in textarea{border:0;background:none;padding:9px 0;min-height:24px;max-height:140px;resize:none;border-radius:0;line-height:1.4}
.cg-in textarea:focus{border:0}
.cg-send{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--tx);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cg-send:disabled{opacity:.3;cursor:default}
.cg-send svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cg-note{text-align:center;color:var(--mut);font-size:11.5px;margin:4px 0 0}
</style>

<script>
const STAGES=["Idea","Scripted","Rendered","Uploaded"];
const CHECKS=[
  ["orig","Original script and angle, not copied from another video or article"],
  ["src","Facts checked and sources saved"],
  ["hook3","Strong hook in the first 3 seconds"],
  ["ai","AI-use disclosure decided (turn it on if visuals look real but are synthetic)"],
  ["music","Music is from the YouTube Audio Library or properly licensed"],
  ["notcomp","Not a clip compilation or reused content without your own added value"],
  ["meta","Title, description and tags ready"]
];
const ICON={
  today:'<svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>',
  writer:'<svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
  plan:'<svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
  ask:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/><path d="M9.5 10h5M9.5 13.5h3"/></svg>',
  post:'<svg viewBox="0 0 24 24"><path d="M21 3 10 14"/><path d="M21 3l-7 18-4-7-7-4z"/></svg>',
  stats:'<svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>'
};
let S={videos:[],log:{},interval:1,niche:"history, science and odd true stories, 1-minute vertical Shorts",refs:"@ricksclips3000",money:{subs:0,views90:0,module:false},posts:[],chat:[],updatedAt:0};
const UI={tab:"today",topic:"",score:true,run:null,res:null,open:null,detail:null};
let ref=null,saveTimer=null,sample=null,mcp=null;
/* ---- standalone: talk to Claude directly with the user's own API key ---- */
const KEYN="rune_api_key";
const getKey=()=>{try{return localStorage.getItem(KEYN)||""}catch(e){return ""}};
const setKey=v=>{try{localStorage.setItem(KEYN,String(v).trim())}catch(e){}};
const MODELS=["claude-sonnet-5-5","claude-sonnet-4-6"];
const keyCard=()=>'<div class="card"><div class="sec">Connect AI</div><div class="m" style="margin-bottom:10px">Paste your Anthropic API key. It is saved only on this phone.</div><input type="password" id="apikey" placeholder="sk-ant-..." autocomplete="off" value="'+esc(getKey())+'"><div class="m" style="margin-top:8px">Get a key at console.anthropic.com. API use is billed separately from Claude plans.</div></div>';
async function callClaude(body){
  const key=getKey();
  if(!key){toast("Add your API key in Stats, Settings");const e=new Error("Add your API key first. Paste it in the box above, or in Stats, Settings.");e.code="no_key";throw e}
  let last;
  for(const model of MODELS){
    let r,j;
    try{
      r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(Object.assign({model},body))});
      j=await r.json().catch(()=>({}));
    }catch(err){const e=new Error("No internet connection.");e.code="offline";throw e}
    if(r.ok)return j;
    const msg=(j.error&&j.error.message)||("Error "+r.status);
    const e=new Error(r.status===401?"Your API key was rejected. Check it in Stats, Settings.":msg);
    e.code=r.status===401?"bad_key":r.status===429?"rate_limited":"api_error";last=e;
    if(r.status===404||(r.status===400&&/model/i.test(msg)))continue;
    throw e;
  }
  throw last;
}
const textOf=j=>(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
async function sampleFn(input,opts){
  opts=opts||{};
  const messages=typeof input==="string"?[{role:"user",content:input}]:input.map(m=>({role:m.role,content:m.content}));
  const tools=(opts.tools||[]).map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema||{type:"object",properties:{}}}));
  let acc="";
  for(let i=0;i<6;i++){
    const j=await callClaude(Object.assign({max_tokens:opts.maxTokens||3000,messages},tools.length?{tools}:{}));
    acc+=textOf(j);
    if(j.stop_reason==="tool_use"){
      messages.push({role:"assistant",content:j.content});
      const results=[];
      for(const b of j.content.filter(b=>b.type==="tool_use")){
        const tool=opts.tools.find(x=>x.name===b.name);let out;
        try{out=String(await tool.execute(b.input))}catch(e){out="Error: "+(e.message||e)}
        results.push({type:"tool_result",tool_use_id:b.id,content:out});
      }
      messages.push({role:"user",content:results});
      if(opts.onText&&acc)opts.onText({text:acc});
      continue;
    }
    if(opts.onText)opts.onText({text:acc});
    return {text:acc,truncated:j.stop_reason==="max_tokens"};
  }
  return {text:acc,truncated:true};
}
sampleFn.json=async(input,opts)=>{
  const r=await sampleFn(input,opts);
  const m=r.text.replace(/```json|```/g,"").match(/[\[{][\s\S]*[\]}]/);
  if(!m)throw new Error("The AI did not return a usable answer. Try again.");
  return JSON.parse(m[0]);
};


const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diff=(a,b)=>Math.round((a-b)/864e5);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const vid=id=>S.videos.find(v=>v.id===id);

function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Copied")}catch(e){toast("Copy is blocked here. Select the text instead.")}}

function ensure(v){
  if(typeof v.stage!=="number")v.stage=Math.max(0,STAGES.indexOf(v.status));
  v.note=Object.assign({promise:"",hook:"",onscreen:"",script:"",loop:"",free:"",claims:[]},v.note||{});
  if(!Array.isArray(v.note.claims))v.note.claims=[];
  v.check=v.check||{};
  v.result=Object.assign({views:"",engaged:"",viewed:"",avg:"",drop:"",label:""},v.result||{});
  return v;
}
function normalize(){
  S.log=S.log||{};
  S.posts=Array.isArray(S.posts)?S.posts:[];
  S.chat=Array.isArray(S.chat)?S.chat.filter(m=>m&&(m.role==='user'||m.role==='assistant')&&typeof m.content==='string').slice(-30):[];
  S.money=Object.assign({subs:0,views90:0,module:false},S.money||{});
  S.videos=(S.videos||[]).map(ensure);
}

/* storage */
function lsGet(){try{return JSON.parse(localStorage.getItem("rune_studio")||"null")}catch(e){return null}}
function lsSet(){try{localStorage.setItem("rune_studio",JSON.stringify(S))}catch(e){}}
function save(){
  S.updatedAt=Date.now();lsSet();clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{if(ref){try{await ref.set(S)}catch(e){}}},500);
}

/* streak: done days count, X breaks the chain, rest days are free and never break it */
const doneDates=()=>Object.keys(S.log).filter(k=>S.log[k]==="done").sort();
function gapBetween(a,b){ // days between two dates, minus rest days; flag if an X sits between
  let gap=diff(a,b),missed=false;
  for(let k=1;k<diff(a,b);k++){const v=S.log[ymd(addDays(b,k))];if(v==="x")missed=true;if(v==="rest")gap--}
  return {gap,missed};
}
function streakFrom(ds){
  let n=0;
  for(let i=ds.length-1;i>=0;i--){
    if(i===ds.length-1){n=1;continue}
    const g=gapBetween(parse(ds[i+1]),parse(ds[i]));
    if(g.gap>S.interval||g.missed)break;
    n++;
  }
  return n;
}
function streak(){
  const ds=doneDates();if(!ds.length)return 0;
  const last=parse(ds[ds.length-1]),t=today();
  const g=gapBetween(addDays(t,1),last); // include today as part of the span
  if(g.gap-1>S.interval)return 0;
  return streakFrom(ds);
}
function bestStreak(){
  const ds=doneDates();let best=0;
  for(let i=1;i<=ds.length;i++)best=Math.max(best,streakFrom(ds.slice(0,i)));
  return best;
}
const weekDone=()=>doneDates().filter(k=>{const d=diff(today(),parse(k));return d>=0&&d<7}).length;
const readyCount=v=>CHECKS.filter(([k])=>v.check[k]).length;

/* views */
function renderTabs(){
  const T=[["today","Today"],["writer","Writer"],["plan","Plan"],["ask","AI"],["stats","Stats"]];
  $("tabs").innerHTML=T.map(([k,l])=>'<button class="tab'+(UI.tab===k?" on":"")+'" data-tab="'+k+'">'+ICON[k]+l+'</button>').join("");
}

/* actions */
function setDay(k,v){if(v)S.log[k]=v;else delete S.log[k];save();render(true)}
function advance(id){
  const v=vid(id);if(!v||v.stage>=3)return;
  const rc=readyCount(v);
  v.stage++;
  if(v.stage===3){
    v.uploadedAt=ymd(today());S.log[ymd(today())]="done";
    toast(rc<CHECKS.length?"Marked uploaded. Checklist was "+rc+" of "+CHECKS.length+".":"Marked uploaded. Streak updated.");
  }
  save();render(true);
}
function addVideo(title,pack,note){
  const v=ensure({id:uid(),title,stage:0,uploadedAt:null,pack:pack||null});
  if(note)Object.assign(v.note,note);
  S.videos.unshift(v);save();return v;
}
function setPath(path,val){
  const parts=path.split(".");
  if(parts[0]==="money"){S.money[parts[1]]=parts[1]==="module"?val:(val===""?0:+val);return}
  const v=vid(UI.detail);if(!v)return;
  if(parts.length===1)v[parts[0]]=val;else v[parts[0]][parts[1]]=val;
}
const SEL="[data-tab],[data-set],[data-day],[data-adv],[data-del],[data-open],[data-addgo],[data-ct],[data-use],[data-cp],[data-vt],[data-vd],[data-detail],[data-back],[data-addclaim],[data-delclaim],[data-draft],[data-pa],[data-ask],#go";
document.addEventListener("click",e=>{
  const b=e.target.closest(SEL);
  if(!b)return;
  const d=b.dataset;
  if(d.tab){UI.tab=d.tab;if(d.tab!=="plan")UI.detail=null;render();if(d.tab==="post")onOpenPost();if(d.tab==="ask")askScroll()}
  else if(d.set!==undefined)setDay(ymd(today()),d.set)
  else if(d.day){const c=S.log[d.day];setDay(d.day,!c?"done":c==="done"?"x":c==="x"?"rest":"")}
  else if(d.adv)advance(d.adv)
  else if(d.del){S.videos=S.videos.filter(v=>v.id!==d.del);save();render(true)}
  else if(d.detail){UI.tab="plan";UI.detail=d.detail;render()}
  else if(d.back){UI.detail=null;render()}
  else if(d.addgo){const i=$("newTitle"),t=i.value.trim();if(t){addVideo(t);render(true);const n=$("newTitle");n&&n.focus()}}
  else if(d.addclaim){vid(UI.detail).note.claims.push({text:"",url:"",ok:false});save();render(true)}
  else if(d.delclaim!==undefined){vid(UI.detail).note.claims.splice(+d.delclaim,1);save();render(true)}
  else if(d.pa)postAction(d)
  else if(d.ask)askAction(d)
  else if(d.draft)draftScript();
  else if(d.ct!==undefined)copy(UI.res.titles[+d.ct].title)
  else if(d.use!==undefined){
    const r=UI.res;
    addVideo(r.titles[+d.use].title,{tags:r.tags,description:r.description+"\n\n"+r.hashtags.join(" "),hook:r.hook},{hook:r.hook,onscreen:r.thumb[0]||""});
    toast("Saved to Plan")
  }
  else if(d.cp==="tags")copy(UI.res.tags.join(", "))
  else if(d.cp==="desc")copy(UI.res.description+"\n\n"+UI.res.hashtags.join(" "))
  else if(d.cp==="hook")copy(UI.res.hook)
  else if(d.vt)copy(vid(d.vt).pack.tags.join(", "))
  else if(d.vd)copy(vid(d.vd).pack.description)
  else if(b.id==="go")runWriter();
});
document.addEventListener("keydown",e=>{

  if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&e.target.id==="q"){e.preventDefault();sendAsk(e.target.value)}

document.addEventListener("input",e=>{
  const t=e.target,id=t.id;
  if(t.dataset&&t.dataset.p){UI.post[t.dataset.p]=t.type==="checkbox"?t.checked:t.value;return}
  if(id==="apikey"){setKey(t.value);return}
  if(id==="q"){UI.askDraft=t.value;t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px";return}

  if(id==="refs"){S.refs=t.value;save();return}

    if(row&&v){const cl=v.note.claims[+row.dataset.ci],f=t.dataset.cf;cl[f]=f==="ok"?t.checked:t.value;save()}

    if(f==="money.subs"||f==="money.views90"){
      const M=S.money,p=(a,b)=>Math.min(100,Math.round((+a||0)/b*100));
      const subs=p(M.subs,1000),vw=p(M.views90,1e7);
      $("p1").className="prog"+(subs>=100?" full":"");$("p1").firstChild.style.width=subs+"%";$("p1").nextSibling.textContent=subs+"% of 1,000";
      $("p2").className="prog"+(vw>=100?" full":"");$("p2").firstChild.style.width=vw+"%";$("p2").nextSibling.textContent=vw+"% of 10,000,000";
    }
  }
});
document.addEventListener("change",e=>{

async function draftScript(){
  const v=vid(UI.detail);if(!v)return;
  if(!sample){toast("The AI writer is not available in this view");return}
  const b=$("draftBtn");b.disabled=true;b.textContent="Writing...";
  try{
    const prompt='You write narrated YouTube Shorts scripts for a channel about: '+S.niche+'.\nVIDEO TITLE: '+v.title+'\n'
      +'Write the script. Rules: 130 to 150 spoken words of narration only (no stage directions, no emojis). Open with the strangest, most surprising moment, not an intro. Build 3 to 5 beats linked with "but" and "therefore". Pay off the promise at the end. No "like and subscribe". The final line should flow back into the first line so the Short loops. Do NOT invent quotes, dates, numbers or names. If you are not sure of a fact, leave it out.\n'
      +'Also list every factual claim the script makes so the creator can verify each one.\n'
      +'Return ONLY JSON: {"promise":"one sentence","hooks":[{"pattern":"name","line":"","onscreen":"max 4 words"}],"script":"","loop":"the final line","claims":["..."]} with exactly 3 hooks.';
    const out=await sample.json(prompt,{modelTier:"default",cache:false});
    const n=v.note,hooks=Array.isArray(out.hooks)?out.hooks:[];
    if(!n.promise&&out.promise)n.promise=String(out.promise);
    if(!n.hook&&hooks[0])n.hook=String(hooks[0].line||"");
    if(!n.onscreen&&hooks[0])n.onscreen=String(hooks[0].onscreen||"");
    if(!n.script&&out.script)n.script=String(out.script);
    if(!n.loop&&out.loop)n.loop=String(out.loop);
    if(hooks.length>1)n.free=(n.free?n.free+"\n\n":"")+"Other hook options:\n"+hooks.slice(1).map(h=>"- "+(h.pattern||"Hook")+": "+(h.line||"")+" [on screen: "+(h.onscreen||"")+"]").join("\n");

/* writer */
const clip=(x,n)=>{let s=typeof x==="string"?x:JSON.stringify(x);return s.length>n?s.slice(0,n)+" ...":s};
function findScore(o,d){
  d=d||0;if(d>5||o==null)return null;
  if(typeof o==="number")return o;
  if(typeof o==="string"){const m=o.match(/\b(\d{1,3}(?:\.\d+)?)\b/);return m?+m[1]:null}
  if(typeof o==="object"){
    for(const k of Object.keys(o))if(/score/i.test(k)){const v=findScore(o[k],d+1);if(v!=null)return v}
    for(const k of Object.keys(o)){const v=findScore(o[k],d+1);if(v!=null)return v}
  }
  return null;
}
function errText(e){
  const c=e&&e.code;
  if(c==="needs_reauth")return "vidIQ needs you to reconnect it in Settings, Connectors.";
  if(c==="server_not_connected")return "vidIQ is not connected. Add it in Settings, Connectors.";
  if(c==="approval_required"||c==="not_in_manifest"||c==="consent_required")return "vidIQ access was not allowed for this app.";
  if(c==="rate_limited"||c==="server_unavailable")return "vidIQ is busy. Try again in a minute.";
  return (e&&e.message)?String(e.message).slice(0,120):"unknown error";
}
async function runWriter(){
  const topic=($("topic")&&$("topic").value||UI.topic).trim();
  if(!topic){toast("Type your video idea first");return}
  UI.topic=topic;
  if(!sample){UI.run={busy:false,steps:[],error:"The AI writer is not available in this view. Open the app in Claude and try again."};$("wOut").innerHTML=writerOut();return}
  UI.res=null;
  const steps=[
    {label:"Understanding your idea",state:"run"},
    {label:"Searching viral Shorts and trends",state:"wait"},
    {label:"Checking search demand",state:"wait"},
    {label:"Studying your reference channels",state:"wait"},
    {label:"Writing titles, tags and hook",state:"wait"},
    {label:"Scoring titles",state:"wait"}
  ];
  UI.run={busy:true,steps,error:null};
  $("go").disabled=true;
  const upd=(i,state,note)=>{steps[i].state=state;steps[i].note=note||"";$("wOut").innerHTML=writerOut()};
  upd(0,"run");
  try{
    let seed={keyword:topic.split(/\s+/).slice(0,4).join(" "),question:topic.split(/\s+/).slice(0,3).join(" ")};
    try{
      const s=await sample.json('A YouTube Shorts creator wants to make a video about: "'+topic+'"\nGive the best short search seeds for YouTube research.\nReturn ONLY JSON: {"keyword":"2-4 word core search phrase","question":"1-3 word seed for question searches"}',{modelTier:"quick"});
      if(s&&s.keyword)seed=s;
    }catch(e){}
    upd(0,"ok",seed.keyword);
    const vcall=(tool,input)=>mcp.callTool("vidIQ",tool,input,{cache:{staleTime:600000,gcTime:900000}}).then(r=>r.payload!==undefined?r.payload:r);
    const data={outliers:null,trending:null,keywords:null,questions:null,refs:[]};
    const notes=[];
    const T=[];
    if(mcp){
      T.push(Promise.allSettled([
        vcall("vidiq_outliers",{keyword:seed.keyword,contentType:"short",publishedWithin:"threeMonths",limit:10,sort:"breakoutScore"}),
        vcall("vidiq_trending_videos",{videoFormat:"short",titleQuery:seed.keyword,sortBy:"recentVph",limit:8,videoTitleLanguage:"en"})
      ]).then(([o,t])=>{
        if(o.status==="fulfilled")data.outliers=o.value;
        if(t.status==="fulfilled")data.trending=t.value;
        const bad=[o,t].find(x=>x.status==="rejected");
        upd(1,bad&&!data.outliers&&!data.trending?"fail":"ok",bad&&!data.outliers&&!data.trending?errText(bad.reason):"");
        if(bad)notes.push(errText(bad.reason));
      }));
      T.push(Promise.allSettled([
        vcall("vidiq_keyword_research",{keyword:seed.keyword,mode:"research",limit:15}),
        vcall("vidiq_keyword_research",{keyword:seed.question||seed.keyword,mode:"questions",limit:8})
      ]).then(([k,q])=>{
        if(k.status==="fulfilled")data.keywords=k.value;
        if(q.status==="fulfilled")data.questions=q.value;
        const bad=[k,q].find(x=>x.status==="rejected");
        upd(2,bad&&!data.keywords&&!data.questions?"fail":"ok",bad&&!data.keywords&&!data.questions?errText(bad.reason):"");
        if(bad)notes.push(errText(bad.reason));
      }));
      const refs=S.refs.split(",").map(x=>x.trim()).filter(Boolean).slice(0,2);
      T.push(Promise.allSettled(refs.map(r=>vcall("vidiq_channel_videos",{channelId:r,videoFormat:"short",popular:true}).then(v=>({ch:r,v})))).then(rs=>{
        rs.forEach(x=>{if(x.status==="fulfilled")data.refs.push(x.value)});
        const bad=rs.find(x=>x.status==="rejected");
        upd(3,!refs.length?"skip":data.refs.length?"ok":"fail",!refs.length?"none set":data.refs.length?"":errText(bad&&bad.reason));
      }));
      await Promise.all(T);
    }else{
      upd(1,"fail","vidIQ is not available here");upd(2,"skip");upd(3,"skip");
    }
    upd(4,"run");
    const haveData=!!(data.outliers||data.trending||data.keywords||data.questions||data.refs.length);
    const prompt='You are a YouTube Shorts growth strategist writing for a new channel.\n'
      +'CHANNEL NICHE: '+S.niche+'\nVIDEO IDEA: '+topic+'\n\n'
      +(haveData?'REAL YOUTUBE DATA (from vidIQ, may be messy JSON):\n'
        +'[VIRAL SHORTS ON THIS TOPIC, ranked by breakout score]\n'+clip(data.outliers||"unavailable",4500)+'\n\n'
        +'[TRENDING SHORTS RIGHT NOW]\n'+clip(data.trending||"unavailable",3500)+'\n\n'
        +'[KEYWORDS: search volume and competition]\n'+clip(data.keywords||"unavailable",3500)+'\n\n'
        +'[QUESTION SEARCHES]\n'+clip(data.questions||"unavailable",2000)+'\n\n'
        +'[TOP SHORTS FROM CHANNELS THE CREATOR WANTS TO LEARN FROM]\n'+clip(data.refs.length?data.refs:"unavailable",4500)+'\n\n'
        :'No live data could be loaded. Use your best knowledge of what works on Shorts and say so in the first insight.\n\n')
      +'TASK: Study the data. Find the title patterns, word choices, lengths and angles that outperform. Then write for the video idea. Take patterns from the data, never copy another creator\'s title or script word for word.\n'
      +'RULES: titles under 55 characters, curiosity-driven, truthful, no emojis, no hashtags, each using a different pattern. Tags must favor real keywords from the data with demand and low competition, lowercase, 15 to 20 tags, under 480 characters total. Description: two short sentences that name the topic plainly, plus one line inviting a topic-specific comment, no links. Opening line: under 14 words, spoken in the first 3 seconds, starts at the strangest moment or poses a question the viewer needs answered. On-screen text: 3 options, max 4 words, that imply more than the narration says.\n'
      +'Return ONLY JSON: {"insights":["3 to 4 specific findings from the data, mention actual numbers or title patterns you saw"],"titles":[{"title":"","pattern":"2-3 word pattern name","why":"under 12 words"}],"tags":[""],"hashtags":["#"],"description":"","hook":"","thumb":[""]}\n'
      +'Give exactly 8 titles and 5 hashtags.';
    const out=await sample.json(prompt,{modelTier:"default",cache:false});
    upd(4,"ok");
    const clean=a=>(Array.isArray(a)?a:[]).map(x=>String(x).trim()).filter(Boolean);
    const res={
      insights:clean(out.insights),
      titles:(Array.isArray(out.titles)?out.titles:[]).filter(t=>t&&t.title).map(t=>({title:String(t.title).trim(),pattern:t.pattern||"",why:t.why||"",score:null,best:false})),
      tags:clean(out.tags),hashtags:clean(out.hashtags).map(h=>h[0]==="#"?h:"#"+h),
      description:String(out.description||"").trim(),hook:String(out.hook||"").trim(),thumb:clean(out.thumb)
    };
    if(!res.titles.length)throw new Error("No titles came back. Try again.");
    if(UI.score&&mcp){
      upd(5,"run");
      const top=res.titles.slice(0,5);
      const sc=await Promise.allSettled(top.map(t=>vcall("vidiq_score_title",{title:t.title,type:"short"})));
      let okc=0;
      sc.forEach((r,i)=>{if(r.status==="fulfilled"){const v=findScore(r.value);if(v!=null){top[i].score=v;okc++}}});
      if(okc){
        res.titles.sort((a,b)=>(b.score==null?-1:b.score)-(a.score==null?-1:a.score));
        res.titles[0].best=true;
        upd(5,"ok");
      }else upd(5,"fail","no scores returned");
    }else upd(5,"skip",UI.score?"vidIQ unavailable":"turned off");
    UI.res=res;
    UI.run.busy=false;
    if(!haveData&&notes.length)UI.run.error="vidIQ data did not load ("+notes[0]+"). The results use general knowledge only.";
  }catch(e){
    UI.run.busy=false;
    UI.run.error=(e&&e.code==="not_granted")?"The AI writer needs your permission. Press Analyze again and allow it.":((e&&e.message)?String(e.message).slice(0,160):"Something went wrong. Try again.");
  }
  if(UI.tab==="writer"){const g=$("go");if(g)g.disabled=false;$("wOut").innerHTML=writerOut()}
}

async function importVideo(){
  const P=UI.post,src=(P.url||"").trim();
  if(!src){toast("Paste a video link first");return}
  if(!mcp){toast("vidIQ is not available in this view");return}
  P.vstate="run";P.vnote="Importing. This can take a minute.";P.uploadId="";rr();
  try{
    const isId=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(src);
    let p=await vp("vidiq_video_upload",isId?{uploadId:src}:{url:src,title:((P.title||"Rune Clips video")).slice(0,255)});
    const id=isId?src:deepFind(p,/^uploadId$/i);
    if(!id)throw new Error("vidIQ did not return an upload ID. Check the link is public.");
    for(let i=0;i<30;i++){
      const stt=String(deepFind(p,/^status$/i)||"").toLowerCase();
      if(/fail|error/.test(stt))throw new Error("The import failed. Check the link is public and under 299 MB.");
      if(/ready|complete|done|success/.test(stt)||(!stt&&deepFind(p,/^videoUrl$/i)))break;
      if(i===29)throw new Error("Still processing. Press Import again in a minute.");
      await new Promise(r=>setTimeout(r,3000));
      p=await vp("vidiq_video_upload",{uploadId:id});
    }
    P.uploadId=id;P.vstate="ok";P.vnote="Video ready";
  }catch(e){P.vstate="fail";P.vnote=emsg(e)}
  rr();
}
async function aiFill(){
  const P=UI.post;
  if(!sample){toast("The AI writer is not available in this view");return}
  if(!P.title.trim()){toast("Type a title first");return}
  P.busy="ai";rr();
  try{
    const out=await sample.json('Write publishing text for a short vertical video titled "'+P.title.trim()+'" on a channel about: '+S.niche+'. Return ONLY JSON: {"description":"two plain sentences naming the topic, then one question that invites a specific comment, then a new line with 4 relevant hashtags","tags":["15 lowercase tags, under 480 characters total"]}. Do not invent facts.',{modelTier:"quick",cache:false});
    if(out&&out.description)P.desc=String(out.description);
    if(out&&Array.isArray(out.tags))P.tags=out.tags.map(t=>String(t).trim()).filter(Boolean).join(", ");
  }catch(e){toast(e&&e.code==="not_granted"?"The AI writer needs your permission":"Could not write right now")}
  P.busy="";rr();
}
async function checkPost(){
  const P=UI.post,A=UI.acc;
  const fail=m=>{P.msg=m;P.busy="";rr()};
  P.msg="";
  if(!mcp)return fail("vidIQ is not available in this view.");
  if(!P.uploadId)return fail("Import your video first (step 1).");
  const title=P.title.trim();
  if(!title)return fail("Add a title.");
  if(title.length>100||/[<>]/.test(title))return fail("The title must be under 100 characters and cannot contain < or >.");
  const when=new Date(P.when);
  if(isNaN(when)||when.getTime()<Date.now()+5*60000)return fail("Pick a time at least 5 minutes from now.");
  const dests=[];
  if(P.ytOn&&A.yt){
    if(!P.ytPriv)return fail("Choose who can watch on YouTube.");
    const tags=P.tags.split(",").map(x=>x.trim().replace(/[<>]/g,"")).filter(Boolean).slice(0,30);
    const d={platform:"YOUTUBE",platformAccountId:A.yt.platformAccountId,title,privacyStatus:P.ytPriv};
    if(tags.length)d.tags=tags;
    dests.push(d);
  }
  if(P.ttOn&&A.tt){
    if(!P.ttPriv||!P.ttComment||!P.ttAi)return fail("Answer every TikTok question.");
    if(!P.ttMusic)return fail("Confirm TikTok's music usage to post there.");
    dests.push({platform:"TIKTOK",platformAccountId:A.tt.platformAccountId,privacyLevel:P.ttPriv,allowComment:P.ttComment==="yes",isAiGenerated:P.ttAi==="yes",musicUsageConfirmed:true});
  }
  if(!dests.length)return fail("Pick at least one place to post.");
  P.busy="check";P.draft=null;rr();
  try{
    const input={destinations:dests,media:[{type:"video",id:P.uploadId}],publishAt:when.toISOString()};
    if(P.desc.trim())input.text=P.desc.trim();
    const p=await vp("vidiq_social_post_draft_create",input);
    const postId=deepFind(p,/^postId$/i),revision=deepFind(p,/^revision$/i);
    if(!postId||!revision)throw new Error("vidIQ did not return a draft. Try again.");
    const arr=(p&&Array.isArray(p.destinations))?p.destinations:[];
    const rows=arr.length?arr.map(x=>{
      const st=String(x.status||"checked"),why=x.reason||x.error||x.message||(Array.isArray(x.errors)?x.errors.join(", "):"")||"";
      return {platform:x.platform||"",status:st,reason:typeof why==="string"?why:JSON.stringify(why).slice(0,160),bad:/refus|fail|invalid|error/i.test(st)};
    }):dests.map(d=>({platform:d.platform,status:"checked",reason:"",bad:false}));
    const ready=(p&&typeof p.ready==="boolean")?p.ready:null;
    P.draft={postId,revision,ready,dests:rows,when:when.toISOString(),title,names:dests.map(d=>d.platform)};
  }catch(e){P.msg=emsg(e)}
  P.busy="";rr();
}
async function confirmPost(){
  const P=UI.post,D=P.draft;
  if(!D||!D.postId||!D.revision){toast("Check the post first");return}
  P.busy="confirm";rr();
  try{
    await vp("vidiq_social_post_publish",{postId:D.postId,revision:D.revision});
    S.posts.unshift({id:D.postId,title:D.title,publishAt:D.when,names:D.names,planId:P.planId||"",status:"scheduled",link:"",note:""});
    save();
    UI.post=newPost();
    toast("Scheduled. vidIQ will post it at your time.");
    render(true);
    syncPosts(true);
  }catch(e){P.msg=emsg(e);P.busy="";rr()}
}
async function syncPosts(silent){
  if(!mcp)return;
  await dbReady;
  const pend=S.posts.filter(p=>p.status==="scheduled");
  let ch=false;
  for(const po of pend){
    try{
      const p=await vp("vidiq_social_post_status",{postId:po.id});
      const st=new Set();walk(p,(k,v)=>{if(/status/i.test(k)&&typeof v==="string")st.add(v.toLowerCase())});
      po.note=[...st].join(", ");
      const waiting=["scheduled","submitted","inprogress","draft"].some(s=>st.has(s));
      const due=new Date(po.publishAt)<=new Date();
      if(st.has("failed")&&!waiting){po.status="failed";ch=true}
      else if(st.has("cancelled")&&!waiting){po.status="cancelled";ch=true}
      else if(st.has("completed")&&!waiting&&due){
        po.status="live";ch=true;
        let link="";walk(p,(k,v)=>{if(!link&&typeof v==="string"&&/^https?:\/\/(www\.)?(youtube\.com|youtu\.be|tiktok\.com)/.test(v))link=v});
        po.link=link;
        const day=ymd(new Date(po.publishAt));
        S.log[day]="done";
        const v=po.planId&&vid(po.planId);
        if(v&&v.stage<3){v.stage=3;v.uploadedAt=day}
      }
    }catch(e){}
  }
  if(ch){save();toast("Upload marked done from vidIQ");if(UI.tab!=="writer")render(true)}
  else if(!silent)toast(pend.length?"Nothing new yet":"No scheduled posts")
}
async function checkChannel(){
  if(!mcp||!UI.acc.yt){toast("YouTube is not connected");return}
  toast("Checking your channel...");
  try{
    const p=await vp("vidiq_user_videos",{channelId:UI.acc.yt.platformAccountId,limit:15,order:"newest",privacyStatus:["public"]});
    const cut=Date.now()-60*864e5,now=new Date();let n=0;
    walk(p,(k,v)=>{if(/publish/i.test(k)&&typeof v==="string"){const d=new Date(v);if(!isNaN(d)&&d<=now&&d.getTime()>cut){const day=ymd(d);if(S.log[day]!=="done"){S.log[day]="done";n++}}}});
    if(n)save();
    toast(n?n+" upload day"+(n>1?"s":"")+" marked done":"Already up to date");
    if(n)render(true);
  }catch(e){toast(emsg(e))}
}
function postAction(d){
  const a=d.pa;
  if(a==="refresh")loadAccounts();
  else if(a==="ttconnect")connectTikTok();
  else if(a==="ytconnect")connectYouTube();
  else if(a==="import")importVideo();
  else if(a==="aifill")aiFill();
  else if(a==="check")checkPost();
  else if(a==="confirm")confirmPost();
  else if(a==="canceldraft"){UI.post.draft=null;render(true)}
  else if(a==="sync")syncPosts(false);
  else if(a==="channel")checkChannel();
  else if(a==="delpost"){S.posts.splice(+d.i,1);save();render(true)}
}

/* ---------- Ask: chat assistant that knows YouTube and this app ---------- */

const toolsLine=()=>UI.ask.tools.length?"Checking: "+UI.ask.tools.join(", ")+(UI.ask.vcalls?" (about "+UI.ask.vcalls*5+" vidIQ credits)":""):"";
function askScroll(){setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),30)}

  const empty=!S.chat.length&&!A.busy?'<div class="cg-empty"><div class="cg-logo">'+SP+'</div><h2>What can I help with?</h2><div class="cg-sug">'
    +SUGGEST.slice(0,4).map(q=>'<button data-ask="send" data-q="'+esc(q)+'">'+esc(q)+'</button>').join("")+'</div></div>':"";

  const err=A.err?'<div class="m" style="color:var(--amber);margin:8px 0">'+esc(A.err)+'</div>':'';

function askAction(d){
  if(d.ask==="send"){const q=d.q||($("q")?$("q").value:"");sendAsk(q)}
  else if(d.ask==="clear"){S.chat=[];save();render(true)}
  else if(d.ask==="copy"){const m=S.chat[+d.i];if(m)copy(m.content)}
}
function appState(){
  const t=today(),ds=doneDates();
  const last14=Array.from({length:14},(_,i)=>{const d=addDays(t,i-13),k=ymd(d);return {date:k,status:S.log[k]||"none"}});
  return {today:ymd(t),goalEveryDays:S.interval,currentStreak:streak(),bestStreak:bestStreak(),daysUploadedTotal:ds.length,last14Days:last14,
    plan:S.videos.slice(0,15).map(v=>({title:v.title,stage:STAGES[v.stage],checklistDone:readyCount(v)+" of "+CHECKS.length,result:v.result.label||undefined})),
    scheduledPosts:S.posts.slice(0,8).map(p=>({title:p.title,time:p.publishAt,status:p.status,where:p.names})),
    monetization:S.money,niche:S.niche,youtubeConnected:!!UI.acc.yt,tiktokConnected:!!UI.acc.tt};
}
function askPreamble(){
return 'You are the helper inside "Rune Clips Studio", an app for a new faceless Shorts channel (@runeclipsofficial). Channel niche: '+S.niche+'. Today is '+ymd(today())+'.\n'
+'The creator is not a native English speaker: use short, simple sentences and plain words. Keep answers under 150 words unless asked for more. Use short lines, and **bold** only for key words. No tables. Answer in the language the creator writes in.\n'
+'You can answer questions about YouTube (Shorts, growth, titles, tags, hooks, scripts, analytics, monetization, policies, copyright) and about how this app works. Be honest. If you are not sure, or a rule may have changed, say so and tell them to check YouTube Help or YouTube Studio. Never invent numbers. Separate official YouTube rules from creator opinion.\n'
+'TOOLS: use get_app_state for questions about their streak, plan or settings. Use the vidIQ tools only when live YouTube data is needed. Each costs 5 credits and you may use at most 3 per answer. Use add_to_plan only when the creator asks to add something. You cannot post, schedule, delete or change anything else.\n'
+'APP TABS: Today (streak ring, "I uploaded today" button, rest day), Writer (AI titles, tags, hook from vidIQ data), Plan (ideas, script notes, fact check, pre-upload checklist, results), AI (this chat), Stats (streak stats, monetization progress, settings). Scheduled posts go out by themselves on vidIQ servers; the app marks the day done when it is opened after posting. The app cannot send reminders when closed.\n'
+'KNOWLEDGE (researched 22 Nov 2026, may change):\n'
+'OFFICIAL: Full YouTube Partner Program needs 1,000 subscribers plus either 4,000 public long-form watch hours in 12 months or 10 million Shorts views in 90 days. Shorts-feed watch time does not count toward the 4,000 hours. Shorts ad revenue needs the Shorts Monetization Module accepted in Studio. New Partner Program terms start 1 Feb 2027; accept them in Studio by 31 Jan 2027. A lower early-access tier exists but its numbers were not verified: tell them to check the Earn tab.\n'
+'OFFICIAL: "Inauthentic content" policy targets mass-produced, template-like videos. Reused content needs real added value. AI that visualizes your own original script is allowed; generic stitched AI clips with no story are not. Realistic altered or synthetic content must be disclosed in the upload settings (AI use). Clearly animated or unrealistic content does not need it. Repeated non-disclosure can lead to penalties.\n'
+'OFFICIAL: Shorts can be up to 3 minutes (since 15 Oct 2024). A Shorts view counts on every start or replay (since 31 Mar 2025); "engaged views" is used for monetization eligibility. Use YouTube Audio Library or licensed music; claimed music can block or limit a video.\n'
+'OFFICIAL: YouTube has not published how Shorts are ranked. A Short is shown to a small test group first; viewer response decides reach. Posting time and daily frequency are not officially optimized. Hashtags are optional. Titles can be up to 100 characters.\n'
+'CREATOR OPINION (say so): the first 3 seconds decide swipe-away; on-screen text helps; loops help replays; about 130 to 155 words fit a 60-second narration; viewed-not-swiped above 70% is working and above 80% strong; titles of about 20 to 55 characters are common. A vidIQ study of 367,000 new channels found more uploads gives more chances for one outlier but does not make each video better. Fact-check every claim in true-story videos and keep sources.\n'
+'If asked something you cannot know (their private analytics), say what to check in YouTube Studio instead of guessing.';
}
function askTools(){
  const guard=async(label,fn)=>{
    if(!mcp)throw new Error("vidIQ is not available in this view.");
    if(UI.ask.vcalls>=3)throw new Error("Credit limit for this answer is reached. Answer with what you already have.");
    UI.ask.vcalls++;UI.ask.tools.push(label);const e=$("askTools");if(e)e.textContent=toolsLine();
    return clip(await fn(),6000);
  };
  const str={type:"string"};
  return [
    {name:"get_app_state",description:"Get the creator's streak, last 14 days, Plan videos, scheduled posts and settings from this app. Free.",inputSchema:{type:"object",properties:{}},execute:async()=>JSON.stringify(appState())},
    {name:"add_to_plan",description:"Add a video idea to the Plan tab. Use only when the creator asks you to add it.",inputSchema:{type:"object",properties:{title:str},required:["title"]},execute:async i=>{addVideo(String(i.title||"").slice(0,100));UI.ask.tools.push("added to Plan");return "Added to Plan."}},
    {name:"keyword_research",description:"vidIQ YouTube keyword research: search volume, competition, related keywords or question searches. Costs 5 credits.",inputSchema:{type:"object",properties:{keyword:str,mode:{type:"string",enum:["research","questions"]}},required:["keyword"]},execute:i=>guard("keyword research",()=>vp("vidiq_keyword_research",{keyword:String(i.keyword).slice(0,150),mode:i.mode==="questions"?"questions":"research",limit:12}))},
    {name:"viral_shorts",description:"vidIQ: Shorts on a topic that overperformed in the last 3 months, with breakout scores. Costs 5 credits.",inputSchema:{type:"object",properties:{keyword:str},required:["keyword"]},execute:i=>guard("viral Shorts",()=>vp("vidiq_outliers",{keyword:String(i.keyword).slice(0,200),contentType:"short",publishedWithin:"threeMonths",limit:8,sort:"breakoutScore"}))},
    {name:"trending_shorts",description:"vidIQ: Shorts gaining views fastest right now on a topic. Costs 5 credits.",inputSchema:{type:"object",properties:{topic:str},required:["topic"]},execute:i=>guard("trending Shorts",()=>vp("vidiq_trending_videos",{videoFormat:"short",titleQuery:String(i.topic).slice(0,200),sortBy:"recentVph",limit:8,videoTitleLanguage:"en"}))},
    {name:"channel_top_shorts",description:"vidIQ: a channel's most popular Shorts. Give an @handle. Costs 5 credits.",inputSchema:{type:"object",properties:{handle:str},required:["handle"]},execute:i=>guard("channel Shorts",()=>vp("vidiq_channel_videos",{channelId:String(i.handle).slice(0,100),videoFormat:"short",popular:true}))},
    {name:"my_channel_videos",description:"vidIQ: the creator's own latest videos on their connected YouTube channel with views. Costs 5 credits.",inputSchema:{type:"object",properties:{}},execute:()=>guard("your channel",()=>{if(!UI.acc.yt)throw new Error("YouTube is not connected.");return vp("vidiq_user_videos",{channelId:UI.acc.yt.platformAccountId,limit:10,order:"newest"})})},
    {name:"score_title",description:"vidIQ: score a Shorts title for click potential, 0 to 100. Costs 5 credits.",inputSchema:{type:"object",properties:{title:str},required:["title"]},execute:i=>guard("title score",()=>vp("vidiq_score_title",{title:String(i.title).slice(0,100),type:"short"}))}
  ];
}
async function sendAsk(text){
  text=(text||"").trim();
  const A=UI.ask;
  if(!text||A.busy)return;
  if(!sample){A.err="The AI helper is not available in this view. Open the app in Claude.";render(true);return}
  S.chat.push({role:"user",content:text});S.chat=S.chat.slice(-30);
  UI.askDraft="";A.busy=true;A.partial="";A.tools=[];A.vcalls=0;A.err="";
  render(true);askScroll();
  try{
    let hist=S.chat.slice(-14);
    while(hist.length&&hist[0].role!=="user")hist.shift();
    const input=hist.map((m,i)=>({role:m.role,content:(i===0?askPreamble()+"\n\nCONVERSATION STARTS:\n":"")+m.content}));
    const r=await sample(input,{modelTier:"default",cache:false,tools:askTools().filter(t=>mcp||/^(get_app_state|add_to_plan)$/.test(t.name)),onText:({text})=>{A.partial=text;const e=$("askLive");if(e){e.innerHTML=md(text)+'<div class="m" id="askTools" style="margin-top:6px">'+esc(toolsLine())+'</div>'}}});
    const ans=(r&&r.text||A.partial||"").trim();
    S.chat.push({role:"assistant",content:ans?ans+(r&&r.truncated?"\n(The answer was cut short. Ask me to continue.)":""):"I could not write an answer. Try again."});
  }catch(e){
    A.err=e&&(e.code==="no_key"||e.code==="bad_key"||e.code==="offline")?e.message:e&&e.code==="not_granted"?"The helper needs your permission. Send your question again and allow it.":e&&e.code==="rate_limited"?"Too many requests. Wait a minute and try again.":"I could not answer right now. Try again.";
  }
  A.busy=false;save();
  if(UI.tab==="ask"){render(true);askScroll()}
}
